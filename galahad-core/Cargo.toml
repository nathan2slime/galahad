[package]
name = "galahad-core"
version = "0.1.0"
edition = "2021"
description = "Core types and functionality for Galahad"
license = "MIT"

[lib]
path = "src/lib.rs"

[dependencies]
argon2 = { version = "0.5", features = ["password-hash", "rand"] }
rand_core = { version = "0.6", features = ["getrandom"] }
