[package]
name = "galahad-seaorm"
version = "0.1.0"
edition = "2021"
description = "SeaORM integration for Galahad"
license = "MIT"

[lib]
path = "src/lib.rs"

[features]
default = []
postgres = [
    "sea-orm/sqlx-postgres",
    "sea-orm/runtime-tokio-rustls",
    "sea-orm-migration/sqlx-postgres",
    "sea-orm-migration/runtime-tokio-rustls",
]
sqlite = [
    "sea-orm/sqlx-sqlite",
    "sea-orm/runtime-tokio-rustls",
    "sea-orm-migration/sqlx-sqlite",
    "sea-orm-migration/runtime-tokio-rustls",
]
mysql = [
    "sea-orm/sqlx-mysql",
    "sea-orm/runtime-tokio-rustls",
    "sea-orm-migration/sqlx-mysql",
    "sea-orm-migration/runtime-tokio-rustls",
]

[dependencies]
galahad-core = { path = "../galahad-core" }
sea-orm = { version = "2.0.2", default-features = false, features = ["macros", "with-chrono"] }
sea-orm-migration = { version = "2.0.2", default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
