[package]
name = "galahad"
version = "0.1.0"
edition = "2021"
description = "A facade crate for the Galahad library"
license = "MIT"

[workspace]
resolver = "2"
members = [".", "galahad-core", "galahad-seaorm", "galahad-actix"]

[features]
default = []
openapi = ["galahad-actix/openapi"]

[dependencies]
galahad-actix = { path = "galahad-actix" }
galahad-core = { path = "galahad-core" }
galahad-seaorm = { path = "galahad-seaorm", features = ["postgres"] }
sea-orm = { version = "2.0.2", default-features = false }
uuid = { version = "1", features = ["v4"] }
